services:

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "5000:5000"
    container_name: vuln_scanner_frontend

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    ports:
      - "8000:8000"
    container_name: vuln_scanner_backend

  redis:
    image: redis:7
    container_name: vuln_scanner_redis

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
    container_name: vuln_scanner_worker
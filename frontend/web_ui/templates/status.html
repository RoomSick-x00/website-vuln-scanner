<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanning...</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="background"></div>
<nav class="navbar">
    <a href="/" class="nav-logo">Vulnerability Scanner</a>
</nav>
<div class="container">
    <div class="card status-card">
        <div class="spinner-wrap">
            <div class="spinner-ring"></div>
        </div>
        <h1 id="status-title">Scanning...</h1>
        {% if target %}
        <p class="scan-target">Scanning: <strong>{{ target }}</strong></p>
        {% endif %}
        <p id="status-text" class="subtitle">Checking scan status...</p>
        <p class="wait-hint">This usually takes 30–60 seconds</p>
    </div>
</div>
<script>
const scanId = "{{ scan_id }}";
async function checkStatus() {
    try {
        const response = await fetch(`/api/status/${scanId}`);
        const data = await response.json();
        const statusText = document.getElementById("status-text");
        const title = document.getElementById("status-title");
        if (data.status === "QUEUED") {
            statusText.innerText = "Waiting in queue...";
        } else if (data.status === "RUNNING") {
            statusText.innerText = "Scanning target website...";
        } else if (data.status === "COMPLETED" || data.status === "completed") {
            title.innerText = "Scan Complete!";
            statusText.innerText = "Redirecting to results...";
            setTimeout(() => { window.location.href = `/results/${scanId}`; }, 1500);
        } else {
            statusText.innerText = `Status: ${data.status}`;
        }
    } catch (error) {
        document.getElementById("status-text").innerText = "Error checking scan status";
    }
}
setInterval(checkStatus, 3000);
checkStatus();
</script>
</body>
</html>

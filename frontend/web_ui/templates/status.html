<!DOCTYPE html>
<html>
<head>
    <title>Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="navbar">🔍 Vulnerability Scanner</div>

<div class="container">
    <div class="card">
        <h2>Scanning...</h2>

        <div class="spinner"></div>

        <p id="status-text">Checking status...</p>
        <p>Scan ID: {{ scan_id }}</p>
    </div>
</div>

<script>
const scanId = "{{ scan_id }}";

// Call backend every 2 seconds
setInterval(async () => {
    try {
        const res = await fetch(`/api/status/${scanId}`);
        const data = await res.json();

        document.getElementById("status-text").innerText = data.status;

        if (data.status === "COMPLETED") {
            window.location.href = `/results/${scanId}`;
        }

    } catch (err) {
        console.error(err);
    }
}, 2000);
</script>

</body>
</html>
